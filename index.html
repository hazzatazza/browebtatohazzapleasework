<!DOCTYPE html>
<html xmlns='http://w3.org' lang='' xml:lang=''>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, user-scalable=no' />
	<title>Brotato</title>
	<style type='text/css'>
		body { touch-action: none; margin: 0; border: 0 none; padding: 0; text-align: center; background-color: black; }
		#canvas { display: block; margin: 0; color: white; }
		#canvas:focus { outline: none; }
		.godot { font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif; color: #e0e0e0; background-color: #3b3943; background-image: linear-gradient(to bottom, #403e48, #35333c); border: 1px solid #45434e; box-shadow: 0 0 1px 1px #2f2d35; }
		#status { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; visibility: hidden; }
		#status-progress { width: 366px; height: 7px; background-color: #38363A; border: 1px solid #444246; padding: 1px; box-shadow: 0 0 2px 1px #1B1C22; border-radius: 2px; visibility: visible; }
		@media only screen and (orientation:portrait) { #status-progress { width: 61.8%; } }
		#status-progress-inner { height: 100%; width: 0; box-sizing: border-box; transition: width 0.5s linear; background-color: #202020; border: 1px solid #222223; box-shadow: 0 0 1px 1px #27282E; border-radius: 3px; }
		#status-indeterminate { height: 42px; visibility: visible; position: relative; }
		#status-indeterminate > div { width: 4.5px; height: 0; border-style: solid; border-width: 9px 3px 0 3px; border-color: #2b2b2b transparent transparent transparent; transform-origin: center 21px; position: absolute; }
		#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
		#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
		#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
		#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
		#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
		#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
		#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
		#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }
		#status-notice { margin: 0 100px; line-height: 1.3; visibility: visible; padding: 4px 6px; }
	</style>
<link id='-gd-engine-icon' rel='icon' type='image/png' href='Brotato.icon.png' />
<link rel='apple-touch-icon' href='Brotato.apple-touch-icon.png'/><link rel='manifest' href='Brotato.manifest.json'>
</head>
<body>
	<canvas id='canvas'>HTML5 canvas appears to be unsupported.</canvas>
	<div id='status'>
		<div id='status-progress' style='display: none;'><div id ='status-progress-inner'></div></div>
		<div id='status-indeterminate' style='display: none;'><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
		<div id='status-notice' class='godot' style='display: none;'></div>
	</div>

	<script type='text/javascript' src='Brotato.js'></script>
	<script type='text/javascript'>//<![CDATA[

		// Your verified Dropbox direct streaming channel endpoint
		const STREAM_ASSET_URL = "https://dropboxusercontent.com";

		const GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"executable": "Brotato",
			"experimentalVK": false,
			"fileSizes": {
				"Brotato.wasm": 25658069
			},
			"focusCanvas": true,
			"gdnativeLibs": [],
			"serviceWorker": "Brotato.service.worker.js"
		};

		var engine = new Engine(GODOT_CONFIG);

		// Core wrapper injection ensuring files are entirely loaded into engine instances natively
		if (typeof engine.preloadFile === 'function') {
			engine.preloadFile(STREAM_ASSET_URL, "Brotato.pck");
		}

		var statusProgress = document.getElementById('status-progress');
		var statusProgressInner = document.getElementById('status-progress-inner');
		var statusIndeterminate = document.getElementById('status-indeterminate');
		var statusNotice = document.getElementById('status-notice');

		function setStatusNotice(text) {
			while (statusNotice.lastChild) { statusNotice.removeChild(statusNotice.lastChild); }
			var lines = text.split('\n');
			lines.forEach((line) => {
				statusNotice.appendChild(document.createTextNode(line));
				statusNotice.appendChild(document.createElement('br'));
			});
		}

		function displayFailureNotice(err) {
			var msg = err.message || err;
			console.error(msg);
			setStatusNotice(msg);
			document.getElementById('status').style.visibility = 'visible';
			statusNotice.style.display = 'block';
		}

		if (!Engine.isWebGLAvailable()) {
			displayFailureNotice('WebGL not available');
		} else {
			document.getElementById('status').style.visibility = 'visible';
			statusIndeterminate.style.display = 'block';
			
			engine.startGame({
				'onProgress': function (current, total) {
					if (total > 0) {
						statusProgressInner.style.width = current/total * 100 + '%';
						statusIndeterminate.style.display = 'none';
						statusProgress.style.display = 'block';
					}
				},
			}).then(() => {
				document.getElementById('status').style.visibility = 'hidden';
			}, displayFailureNotice);
		}
	//]]></script>
	<!-- Custom Web Port Watermark -->
	<div style="position: fixed; bottom: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); color: #ffffff; font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 5px; border: 1px solid #444; z-index: 9999; pointer-events: none;">
		Web Port by Elizabeth
	</div>
</body>
</html>
